# Upside — production compose stack.
# Five containers on a private bridge network. The api is published only to
# localhost; cloudflared-api and cloudflared-ib publish HTTPS to the public
# internet (with their own per-tunnel trycloudflare URLs).

services:
  ib-gateway:
    # Built from infra/clientportal.gw/Dockerfile — wraps IB's official
    # Client Portal Gateway (Java REST API on port 5000). NOT the legacy
    # TWS Socket API (that was the gnzsnz image, wrong product entirely).
    # Credentials are NEVER set as env vars here — the api container
    # proxies user-entered credentials at login time per the security model.
    build:
      context: ./infra/clientportal.gw
    restart: unless-stopped
    networks:
      - upside

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - upside

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      IB_GATEWAY_URL: https://ib-gateway:5000
      REDIS_URL: redis://redis:6379
      CLOUDFLARED_API_LOG_PATH: /var/log/cloudflared/api.log
      CLOUDFLARED_IB_LOG_PATH: /var/log/cloudflared/ib.log
    depends_on:
      - ib-gateway
      - redis
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    volumes:
      # Read-only share of cloudflared's log so the in-process tunnel watcher
      # can detect Quick Tunnel URL changes. See server/src/services/tunnelWatcher.ts.
      - cloudflared-logs:/var/log/cloudflared:ro
    networks:
      - upside

  cloudflared-api:
    # Cloudflare Quick Tunnel for the api container. --no-autoupdate keeps the
    # URL stable across image updates (auto-update would reassign daily).
    # user: root because named volumes are owned by root and the default
    # cloudflared image runs as a non-root user — would fail to write logfile.
    image: cloudflare/cloudflared:latest
    user: "0:0"
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://api:3001
      - --logfile
      - /var/log/cloudflared/api.log
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - cloudflared-logs:/var/log/cloudflared
    networks:
      - upside

  cloudflared-ib:
    # Cloudflare Quick Tunnel for the IB Client Portal Gateway. Gives the
    # gateway its own public origin so its absolute-path HTML works without
    # proxy rewriting. --no-tls-verify because the gateway has a self-signed
    # cert. Same root/--no-autoupdate discipline as the api tunnel.
    image: cloudflare/cloudflared:latest
    user: "0:0"
    command:
      - tunnel
      - --no-autoupdate
      - --no-tls-verify
      - --url
      - https://ib-gateway:5000
      - --logfile
      - /var/log/cloudflared/ib.log
    depends_on:
      - ib-gateway
    restart: unless-stopped
    volumes:
      - cloudflared-logs:/var/log/cloudflared
    networks:
      - upside

volumes:
  cloudflared-logs:

networks:
  upside:
    driver: bridge

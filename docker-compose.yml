# Upside — production compose stack.
# Three containers on a private bridge network. Only the api is published.

services:
  # ib-gateway is intentionally commented out until Batch 7 supplies the correct image.
  # The previous reference (`ghcr.io/gnzsnz/ib-gateway:stable`) exposes the legacy
  # TWS Socket API on ports 4001-4004 — NOT the Client Portal REST API on port 5000
  # that our backend code (server/src/services/ibGateway.ts) is written against.
  # Batch 7 will add `infra/clientportal.gw/Dockerfile` that packages IB's official
  # Client Portal Gateway (clientportal.gw zip) and we'll wire it back in here.
  #
  # ib-gateway:
  #   build:
  #     context: ./infra/clientportal.gw
  #   restart: unless-stopped
  #   networks:
  #     - upside

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - upside

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      IB_GATEWAY_URL: http://ib-gateway:5000
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    # depends_on ib-gateway re-added once Batch 7 supplies the Client Portal image.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    networks:
      - upside

networks:
  upside:
    driver: bridge

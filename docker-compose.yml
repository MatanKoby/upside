# Upside — production compose stack.
# Four containers on a private bridge network. The api is published only to
# localhost; cloudflared publishes HTTPS to the public internet via a
# trycloudflare URL stored in app_config.api_url.

services:
  ib-gateway:
    # IBeam (voyz/ibeam) wraps IB's Client Portal Gateway and automates the
    # browser-based login at localhost:5000 — the only auth path the gateway
    # supports. Exposes the same REST API on port 5000 with a self-signed
    # cert, so the api code is unchanged. Credentials are read from files
    # mounted from the host at /run/secrets/ — IBEAM_SECRETS_SOURCE=fs.
    # Pin a version (not :latest) so cloudflared-style auto-rotation can't
    # surprise us with a new image.
    #
    # user: root: the IBeam image runs as a non-root user by default, but
    # the host secret files are 0400 owned by `ubuntu` — that uid doesn't
    # exist in the container, so IBeam can't read them. Running as root in
    # the container is safe (container root ≠ host root; sandboxed image)
    # and keeps host-side perms tight.
    image: voyz/ibeam:0.5.11
    user: "0:0"
    # `profiles: [manual]` keeps this service off by default — `docker
    # compose up -d` will NOT start it. The user explicitly turns it on
    # from the Upside FE (which calls /api/auth/ib/connect → the api
    # starts this container via the mounted Docker socket). Reason: IBKR
    # allows only one active session per account; a permanently-running
    # IBeam fights the user's IBKR Mobile sessions for that single slot.
    profiles: [manual]
    environment:
      IBEAM_SECRETS_SOURCE: fs
      IBEAM_ACCOUNT: /run/secrets/ib_account
      IBEAM_PASSWORD: /run/secrets/ib_password
      # Allow time for the 2FA push to arrive on the user's phone and be
      # approved (notification → unlock → IB Key biometric → approve).
      IBEAM_PAGE_LOAD_TIMEOUT: "90"
      IBEAM_OAUTH_TIMEOUT: "90"
      # When (not if) the user opens IBKR Mobile and kicks us out, do NOT
      # try to re-login automatically. The user will reconnect on demand
      # from the Upside FE.
      IBEAM_RESTART_FAILED_SESSIONS: "False"
      IBEAM_AUTHENTICATION_STRATEGY: "A"
      # Slow the maintenance loop so it doesn't churn while we're running.
      IBEAM_MAINTENANCE_INTERVAL: "300"
    volumes:
      - ./secrets/ib_account.txt:/run/secrets/ib_account:ro
      - ./secrets/ib_password.txt:/run/secrets/ib_password:ro
    # No `restart: unless-stopped` — when the user stops this container
    # from Upside, it should stay stopped.
    restart: "no"
    networks:
      - upside

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - upside

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      IB_GATEWAY_URL: https://ib-gateway:5000
      REDIS_URL: redis://redis:6379
      CLOUDFLARED_LOG_PATH: /var/log/cloudflared/api.log
      # Container name the api will start/stop in response to FE Connect/
      # Disconnect taps. Compose names = "<project>-<service>-1" by default.
      IB_GATEWAY_CONTAINER: upside-ib-gateway-1
    # ib-gateway is on the `manual` profile — depends_on against a
    # profile-gated service is allowed; compose just won't auto-start it.
    depends_on:
      - redis
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    volumes:
      # Read-only share of cloudflared's log so the in-process tunnel watcher
      # can detect Quick Tunnel URL changes. See server/src/services/tunnelWatcher.ts.
      - cloudflared-logs:/var/log/cloudflared:ro
      # Docker socket: lets the api start/stop the ib-gateway container on
      # demand. Security: this is effectively root access to the host's
      # Docker. Acceptable for a single-user, self-hosted MVP. If the api
      # is ever exposed multi-tenant, replace this with a privileged
      # control sidecar that exposes only start/stop of whitelisted names.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - upside

  cloudflared:
    # Cloudflare Quick Tunnel for the api container. --no-autoupdate keeps the
    # URL stable across image updates (auto-update would reassign daily).
    # user: root because named volumes are owned by root and the default
    # cloudflared image runs as a non-root user — would fail to write logfile.
    image: cloudflare/cloudflared:latest
    user: "0:0"
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://api:3001
      - --logfile
      - /var/log/cloudflared/api.log
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - cloudflared-logs:/var/log/cloudflared
    networks:
      - upside

volumes:
  cloudflared-logs:

networks:
  upside:
    driver: bridge
    # Pin the subnet to 10.x — IB Client Portal Gateway's default conf.yaml
    # has `10.*` in its ips.allow list (alongside the default Docker bridge
    # at 172.17.0.*). Compose's auto-assigned custom-bridge subnet is in the
    # 172.18+ range, which is NOT in the allow list — the gateway returns
    # "404 Access Denied" to requests from those IPs. Putting our network
    # on a 10.x subnet avoids needing a custom conf.yaml mount.
    ipam:
      config:
        - subnet: 10.10.0.0/24

# Upside — production compose stack.
# Three containers on a private bridge network. Only the api is published,
# and only to localhost (Cloudflare Tunnel terminates HTTPS upstream).

services:
  ib-gateway:
    # Built from infra/clientportal.gw/Dockerfile — wraps IB's official
    # Client Portal Gateway (Java REST API on port 5000). NOT the legacy
    # TWS Socket API (that was the gnzsnz image, wrong product entirely).
    # Credentials are NEVER set as env vars here — the api container
    # proxies user-entered credentials at login time per the security model.
    build:
      context: ./infra/clientportal.gw
    restart: unless-stopped
    networks:
      - upside

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - upside

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      IB_GATEWAY_URL: https://ib-gateway:5000
      REDIS_URL: redis://redis:6379
      CLOUDFLARED_LOG_PATH: /var/log/cloudflared/cloudflared.log
    depends_on:
      - ib-gateway
      - redis
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    volumes:
      # Read-only share of cloudflared's log so the in-process tunnel watcher
      # can detect Quick Tunnel URL changes. See server/src/services/tunnelWatcher.ts.
      - cloudflared-logs:/var/log/cloudflared:ro
    networks:
      - upside

  cloudflared:
    # Cloudflare Tunnel in Quick Tunnel mode — free, no domain required.
    # --no-autoupdate is REQUIRED: cloudflared self-updates daily by default,
    # each update reassigns the trycloudflare.com URL. We update the image
    # explicitly by pulling a new tag.
    #
    # user: root — the cloudflare/cloudflared image runs as a non-root user
    # by default, but named Docker volumes are owned by root:root, so the
    # non-root user can't create the logfile. Running as root inside this
    # container is safe: it's a sandboxed network proxy, container root is
    # not host root, and there's no shell exposure.
    image: cloudflare/cloudflared:latest
    user: "0:0"
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://api:3001
      - --logfile
      - /var/log/cloudflared/cloudflared.log
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - cloudflared-logs:/var/log/cloudflared
    networks:
      - upside

volumes:
  cloudflared-logs:

networks:
  upside:
    driver: bridge
